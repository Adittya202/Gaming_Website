<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 85" width="340" height="85">
  <defs>
    <!-- Doodle filter for sketchy hand-drawn wobble -->
    <filter id="handDrawn" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" />
    </filter>
  </defs>

  <!-- Cute Smiling Sunshine Doodle in Background -->
  <g transform="translate(18, 12)">
    <!-- Sun Rays (hand-sketched lines) -->
    <g stroke="#ffb703" stroke-width="3.5" stroke-linecap="round">
      <line x1="28" y1="2" x2="28" y2="-6" />
      <line x1="28" y1="54" x2="28" y2="62" />
      <line x1="2" y1="28" x2="-6" y2="28" />
      <line x1="54" y1="28" x2="62" y2="28" />
      <line x1="10" y1="10" x2="4" y2="4" />
      <line x1="46" y1="46" x2="52" y2="52" />
      <line x1="46" y1="10" x2="52" y2="4" />
      <line x1="10" y1="46" x2="4" y2="52" />
    </g>
    <!-- Sun Body -->
    <circle cx="28" cy="28" r="22" fill="#ffd166" stroke="#232936" stroke-width="3" />
    <!-- Happy Sun Face -->
    <circle cx="21" cy="24" r="2.5" fill="#232936" />
    <circle cx="35" cy="24" r="2.5" fill="#232936" />
    <!-- Smile -->
    <path d="M22,31 Q28,37 34,31" fill="none" stroke="#232936" stroke-width="2.5" stroke-linecap="round" />
    <!-- Cheeks blush -->
    <ellipse cx="17" cy="29" rx="3" ry="1.5" fill="#ff85a2" opacity="0.8" />
    <ellipse cx="39" cy="29" rx="3" ry="1.5" fill="#ff85a2" opacity="0.8" />
  </g>

  <!-- Puffy Hand-Drawn Cloud overlapping -->
  <g transform="translate(38, 22)">
    <!-- Cloud base with hand-drawn stroke -->
    <path d="M12,32 C6,32 0,26 2,18 C3,11 11,8 18,10 C21,2 35,0 44,7 C51,2 62,5 64,14 C72,14 76,22 73,29 C70,34 62,34 58,32 Z" 
          fill="#ffffff" stroke="#232936" stroke-width="3" stroke-linejoin="round" />
    <!-- Cloud Happy Eyes & Smile -->
    <circle cx="30" cy="20" r="2.2" fill="#232936" />
    <circle cx="44" cy="20" r="2.2" fill="#232936" />
    <path d="M34,24 Q37,28 40,24" fill="none" stroke="#232936" stroke-width="2" stroke-linecap="round" />
    <!-- Cheeks blush -->
    <ellipse cx="26" cy="23" rx="2.5" ry="1.2" fill="#ff85a2" opacity="0.7" />
    <ellipse cx="48" cy="23" rx="2.5" ry="1.2" fill="#ff85a2" opacity="0.7" />
  </g>

  <!-- Hand-drawn typography -->
  <text x="124" y="44" font-family="'Shantell Sans', 'Patrick Hand', 'Comic Sans MS', cursive" font-size="32" font-weight="900" fill="#232936" letter-spacing="0.5">
    Glitch<tspan fill="#ff8500">Nest</tspan>
  </text>

  <!-- Doodle Subtext Badge -->
  <g transform="translate(126, 52)">
    <rect x="0" y="0" width="138" height="20" rx="10" fill="#ffd166" stroke="#232936" stroke-width="2" />
    <text x="69" y="14" font-family="'Patrick Hand', cursive" font-size="12" font-weight="700" fill="#232936" text-anchor="middle" letter-spacing="1">
      ☀ SUNNY ARCADE ☁
    </text>
  </g>
</svg>
