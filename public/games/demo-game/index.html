<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Bounce Arcade - Sunny Clouds Edition</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Shantell+Sans:wght@700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f0f7ff;
      color: #232936;
      font-family: 'Shantell Sans', 'Patrick Hand', cursive, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 56.25vw; /* 16:9 ratio */
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @media (min-aspect-ratio: 16/9) {
      #game-container {
        width: 177.78vh;
        height: 100vh;
      }
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #f8fbff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border-radius: 4px;
    }
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-family: 'Patrick Hand', cursive;
      font-weight: 700;
      font-size: 22px;
      color: #232936;
      text-shadow: 1px 1px 0 #ffffff;
    }
    .hud-val {
      color: #ff8500;
      font-weight: 800;
      margin-left: 4px;
    }
    .hud-lives {
      color: #ff85a2;
      font-size: 24px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
    <div id="ui-overlay">
      <div>SCORE: <span id="scoreVal" class="hud-val">0000</span></div>
      <div>COMBO: <span id="comboVal" class="hud-val">1x</span></div>
      <div>SHIELD: <span id="livesVal" class="hud-lives">♥♥♥</span></div>
    </div>
  </div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.12) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const comboVal = document.getElementById('comboVal');
    const livesVal = document.getElementById('livesVal');

    const GAME_W = 960;
    const GAME_H = 540;

    let score = 0;
    let combo = 1;
    let lives = 3;
    let state = 'START'; // START, PLAYING, GAMEOVER, VICTORY
    let frame = 0;

    // Cloud Paddle
    const paddle = {
      w: 140,
      h: 24,
      x: GAME_W / 2 - 70,
      y: GAME_H - 50,
      speed: 13,
      targetX: GAME_W / 2 - 70
    };

    // Sunballs
    let balls = [];

    function resetBalls() {
      balls = [{
        x: GAME_W / 2,
        y: GAME_H - 85,
        vx: 4 * (Math.random() > 0.5 ? 1 : -1),
        vy: -6,
        r: 14,
        trail: []
      }];
    }

    // Bricks
    const BRICK_ROWS = 5;
    const BRICK_COLS = 9;
    const BRICK_W = 90;
    const BRICK_H = 28;
    const BRICK_PAD = 12;
    const BRICK_OFF_TOP = 65;
    const BRICK_OFF_LEFT = (GAME_W - (BRICK_COLS * (BRICK_W + BRICK_PAD) - BRICK_PAD)) / 2;

    const COLORS = [
      { fill: '#ff85a2', stroke: '#232936', hp: 2, pts: 250 },
      { fill: '#ffd166', stroke: '#232936', hp: 1, pts: 150 },
      { fill: '#70d6ff', stroke: '#232936', hp: 1, pts: 100 },
      { fill: '#06d6a0', stroke: '#232936', hp: 1, pts: 75 },
      { fill: '#c77dff', stroke: '#232936', hp: 1, pts: 50 }
    ];

    let bricks = [];
    function initBricks() {
      bricks = [];
      for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          const type = COLORS[r % COLORS.length];
          bricks.push({
            x: BRICK_OFF_LEFT + c * (BRICK_W + BRICK_PAD),
            y: BRICK_OFF_TOP + r * (BRICK_H + BRICK_PAD),
            w: BRICK_W,
            h: BRICK_H,
            hp: type.hp,
            fill: type.fill,
            stroke: type.stroke,
            pts: type.pts,
            alive: true
          });
        }
      }
    }

    // Sparkle Particles
    let particles = [];
    function spawnParticles(x, y, color, count = 14) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 5;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 1,
          decay: 0.02 + Math.random() * 0.03,
          color,
          size: 3 + Math.random() * 4
        });
      }
    }

    // Powerups
    let powerups = [];
    function spawnPowerup(x, y) {
      if (Math.random() < 0.28) {
        const types = ['MULTI', 'EXPAND', 'POINTS'];
        const type = types[Math.floor(Math.random() * types.length)];
        powerups.push({ x, y, vy: 2.4, type, r: 14 });
      }
    }

    // Controls
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ' || e.key === 'Enter') {
        if (state !== 'PLAYING') startGame();
      }
    });
    window.addEventListener('keyup', e => keys[e.key] = false);

    function handlePointer(clientX) {
      const rect = canvas.getBoundingClientRect();
      const scale = GAME_W / rect.width;
      const x = (clientX - rect.left) * scale;
      paddle.targetX = x - paddle.w / 2;
    }
    window.addEventListener('mousemove', e => handlePointer(e.clientX));
    canvas.addEventListener('touchmove', e => {
      if (e.touches.length > 0) handlePointer(e.touches[0].clientX);
      e.preventDefault();
    }, { passive: false });
    canvas.addEventListener('click', () => {
      if (state !== 'PLAYING') startGame();
    });

    function startGame() {
      score = 0;
      combo = 1;
      lives = 3;
      state = 'PLAYING';
      initBricks();
      resetBalls();
      powerups = [];
      particles = [];
      updateHUD();
      playTone(523.25, 'sine', 0.2, 0.2);
    }

    function updateHUD() {
      scoreVal.textContent = score.toString().padStart(4, '0');
      comboVal.textContent = combo + 'x';
      livesVal.textContent = '♥'.repeat(Math.max(0, lives));
    }

    function update() {
      frame++;
      if (state !== 'PLAYING') return;

      if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.targetX -= paddle.speed;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.targetX += paddle.speed;

      paddle.x += (paddle.targetX - paddle.x) * 0.3;
      if (paddle.x < 15) paddle.x = 15;
      if (paddle.x > GAME_W - paddle.w - 15) paddle.x = GAME_W - paddle.w - 15;

      // Update Balls
      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];
        b.x += b.vx;
        b.y += b.vy;

        b.trail.push({ x: b.x, y: b.y, alpha: 0.6 });
        if (b.trail.length > 6) b.trail.shift();

        // Wall collisions
        if (b.x - b.r < 10) {
          b.x = b.r + 10;
          b.vx *= -1;
          playTone(440, 'triangle', 0.06);
        } else if (b.x + b.r > GAME_W - 10) {
          b.x = GAME_W - 10 - b.r;
          b.vx *= -1;
          playTone(440, 'triangle', 0.06);
        }
        if (b.y - b.r < 10) {
          b.y = b.r + 10;
          b.vy *= -1;
          playTone(440, 'triangle', 0.06);
        }

        // Paddle collision (Soft bouncy cloud paddle)
        if (b.y + b.r >= paddle.y && b.y - b.r <= paddle.y + paddle.h &&
            b.x >= paddle.x && b.x <= paddle.x + paddle.w && b.vy > 0) {
          b.vy = -Math.abs(b.vy);
          const hitPos = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          b.vx = hitPos * 7.5;
          spawnParticles(b.x, paddle.y, '#ffd166', 8);
          playTone(659, 'sine', 0.09, 0.18);
        }

        // Brick collision
        let remaining = 0;
        for (const brick of bricks) {
          if (!brick.alive) continue;
          remaining++;

          if (b.x + b.r > brick.x && b.x - b.r < brick.x + brick.w &&
              b.y + b.r > brick.y && b.y - b.r < brick.y + brick.h) {
            
            const prevX = b.x - b.vx;
            if (prevX <= brick.x || prevX >= brick.x + brick.w) {
              b.vx *= -1;
            } else {
              b.vy *= -1;
            }

            brick.hp--;
            if (brick.hp <= 0) {
              brick.alive = false;
              score += brick.pts * combo;
              combo++;
              spawnParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.fill, 16);
              spawnPowerup(brick.x + brick.w / 2, brick.y + brick.h / 2);
              playTone(784 + combo * 25, 'sine', 0.12, 0.22);
            } else {
              spawnParticles(b.x, b.y, '#ffffff', 6);
              playTone(523, 'sine', 0.08, 0.16);
            }

            updateHUD();
            break;
          }
        }

        if (remaining === 0) {
          state = 'VICTORY';
          playTone(880, 'sine', 0.4, 0.3);
          return;
        }

        if (b.y - b.r > GAME_H) {
          balls.splice(i, 1);
        }
      }

      if (balls.length === 0) {
        lives--;
        combo = 1;
        updateHUD();
        playTone(260, 'sawtooth', 0.25, 0.2);
        if (lives <= 0) {
          state = 'GAMEOVER';
        } else {
          resetBalls();
        }
      }

      // Powerups
      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += p.vy;

        if (p.y + p.r >= paddle.y && p.y - p.r <= paddle.y + paddle.h &&
            p.x >= paddle.x && p.x <= paddle.x + paddle.w) {
          if (p.type === 'MULTI') {
            const base = balls[0] || { x: paddle.x + paddle.w / 2, y: paddle.y - 20, vx: 3, vy: -5 };
            balls.push({ x: base.x, y: base.y, vx: -4, vy: -5, r: 14, trail: [] });
            balls.push({ x: base.x, y: base.y, vx: 4, vy: -5, r: 14, trail: [] });
            playTone(987, 'sine', 0.2, 0.25);
          } else if (p.type === 'EXPAND') {
            paddle.w = Math.min(220, paddle.w + 40);
            setTimeout(() => paddle.w = 140, 8000);
            playTone(740, 'sine', 0.15, 0.2);
          } else if (p.type === 'POINTS') {
            score += 1000;
            updateHUD();
            playTone(1174, 'sine', 0.2, 0.25);
          }
          spawnParticles(p.x, p.y, '#ffd166', 14);
          powerups.splice(i, 1);
        } else if (p.y > GAME_H) {
          powerups.splice(i, 1);
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, GAME_W, GAME_H);

      // Faint sunny sky grid
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1;
      for (let x = 0; x < GAME_W; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, GAME_H);
        ctx.stroke();
      }
      for (let y = 0; y < GAME_H; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(GAME_W, y);
        ctx.stroke();
      }

      // Bricks (Hand-sketched pastel blocks)
      for (const b of bricks) {
        if (!b.alive) continue;
        ctx.fillStyle = b.fill;
        ctx.strokeStyle = '#232936';
        ctx.lineWidth = 2.5;

        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 8);
        ctx.fill();
        ctx.stroke();

        // Inner highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.fillRect(b.x + 6, b.y + 4, b.w - 12, 4);

        if (b.hp > 1) {
          ctx.fillStyle = '#232936';
          ctx.beginPath();
          ctx.arc(b.x + b.w / 2, b.y + b.h / 2, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Powerups
      for (const p of powerups) {
        ctx.save();
        ctx.fillStyle = '#ffd166';
        ctx.strokeStyle = '#232936';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#232936';
        ctx.font = 'bold 12px "Patrick Hand", cursive';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.type === 'MULTI' ? '☀' : p.type === 'EXPAND' ? '☁' : '+', p.x, p.y + 1);
        ctx.restore();
      }

      // Particles
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.strokeStyle = '#232936';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      // Puffy Cloud Paddle
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#232936';
      ctx.lineWidth = 3;

      const px = paddle.x;
      const py = paddle.y;
      const pw = paddle.w;
      const ph = paddle.h;

      ctx.beginPath();
      ctx.roundRect(px, py, pw, ph, 14);
      ctx.fill();
      ctx.stroke();

      // Cloud bumps on top
      ctx.beginPath();
      ctx.arc(px + pw * 0.25, py, 10, Math.PI, 0, false);
      ctx.arc(px + pw * 0.5, py - 4, 14, Math.PI, 0, false);
      ctx.arc(px + pw * 0.75, py, 10, Math.PI, 0, false);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.stroke();

      // Paddle Happy Face
      ctx.fillStyle = '#232936';
      ctx.beginPath();
      ctx.arc(px + pw / 2 - 12, py + 11, 2.5, 0, Math.PI * 2);
      ctx.arc(px + pw / 2 + 12, py + 11, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(px + pw / 2, py + 12, 5, 0, Math.PI, false);
      ctx.stroke();
      ctx.restore();

      // Sunballs
      for (const b of balls) {
        for (let t of b.trail) {
          ctx.save();
          ctx.fillStyle = `rgba(255, 209, 102, ${t.alpha * 0.4})`;
          ctx.beginPath();
          ctx.arc(t.x, t.y, b.r * 0.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        ctx.save();
        ctx.fillStyle = '#ffd166';
        ctx.strokeStyle = '#232936';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Mini Sun Ray spikes
        ctx.strokeStyle = '#ffb703';
        ctx.lineWidth = 2.5;
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
          ctx.beginPath();
          ctx.moveTo(b.x + Math.cos(a) * (b.r + 2), b.y + Math.sin(a) * (b.r + 2));
          ctx.lineTo(b.x + Math.cos(a) * (b.r + 6), b.y + Math.sin(a) * (b.r + 6));
          ctx.stroke();
        }

        // Sun face
        ctx.fillStyle = '#232936';
        ctx.beginPath();
        ctx.arc(b.x - 4, b.y - 2, 2, 0, Math.PI * 2);
        ctx.arc(b.x + 4, b.y - 2, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(b.x, b.y + 2, 3, 0, Math.PI, false);
        ctx.stroke();
        ctx.restore();
      }

      // Overlay Screens
      if (state === 'START') {
        renderScreen('☀ SUNNY CLOUD BOUNCE ☁', 'CLICK OR PRESS SPACE TO START POPPING BLOCKS!', '#ffd166');
      } else if (state === 'GAMEOVER') {
        renderScreen('OH NO! ALL SUNS POPPED ☁', 'CLICK OR PRESS SPACE TO TRY AGAIN!', '#ff85a2');
      } else if (state === 'VICTORY') {
        renderScreen('YAY! ALL CLOUDS CLEARED! ☀', `FINAL SCORE: ${score} - CLICK TO PLAY AGAIN!`, '#06d6a0');
      }
    }

    function renderScreen(title, subtitle, color) {
      ctx.save();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.fillRect(0, 0, GAME_W, GAME_H);

      // Card inside canvas
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#232936';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.roundRect(GAME_W / 2 - 280, GAME_H / 2 - 100, 560, 200, 20);
      ctx.fill();
      ctx.stroke();

      // Banner badge
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(GAME_W / 2 - 250, GAME_H / 2 - 80, 500, 60, 14);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#232936';
      ctx.font = '900 28px "Shantell Sans", "Patrick Hand", cursive';
      ctx.textAlign = 'center';
      ctx.fillText(title, GAME_W / 2, GAME_H / 2 - 40);

      ctx.fillStyle = '#596579';
      ctx.font = '700 20px "Patrick Hand", cursive';
      ctx.fillText(subtitle, GAME_W / 2, GAME_H / 2 + 50);
      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    initBricks();
    resetBalls();
    loop();
  </script>
</body>
</html>
