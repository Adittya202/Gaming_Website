<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Drift: Neo Tokyo - GlitchNest</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #090d16;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 56.25vw;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @media (min-aspect-ratio: 16/9) {
      #game-container {
        width: 177.78vh;
        height: 100vh;
      }
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #090d16;
    }
    #hud {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 16px;
      text-shadow: 0 0 10px #00f2fe;
    }
    .neon-cyan { color: #00f2fe; }
    .neon-violet { color: #9333ea; }
    .neon-gold { color: #fbbf24; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="960" height="540"></canvas>
    <div id="hud">
      <div>SPEED: <span id="hudSpeed" class="neon-cyan">180 KM/H</span></div>
      <div>BOOST: <span id="hudBoost" class="neon-violet">100%</span></div>
      <div>DIST: <span id="hudDist" class="neon-gold">0000 M</span></div>
    </div>
  </div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playBeep(f, d = 0.08, t = 'sine', g = 0.15) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const gn = audioCtx.createGain();
        o.type = t;
        o.frequency.setValueAtTime(f, audioCtx.currentTime);
        gn.gain.setValueAtTime(g, audioCtx.currentTime);
        gn.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.connect(gn);
        gn.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + d);
      } catch (e) {}
    }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const hudSpeed = document.getElementById('hudSpeed');
    const hudBoost = document.getElementById('hudBoost');
    const hudDist = document.getElementById('hudDist');

    const W = 960;
    const H = 540;

    let state = 'TITLE'; // TITLE, PLAYING, CRASHED
    let distance = 0;
    let speed = 180;
    let baseSpeed = 180;
    let maxSpeed = 340;
    let boost = 100;
    let isBoosting = false;

    // Player Hovercar
    const player = {
      x: W / 2,
      y: 440,
      w: 80,
      h: 40,
      vx: 0,
      targetX: W / 2
    };

    // Obstacle Vehicles & Energy Orbs
    let entities = [];
    let particles = [];
    let roadOffset = 0;

    function resetGame() {
      distance = 0;
      speed = baseSpeed;
      boost = 100;
      isBoosting = false;
      player.x = W / 2;
      player.targetX = W / 2;
      player.vx = 0;
      entities = [];
      particles = [];
      state = 'PLAYING';
      playBeep(440, 0.2, 'triangle', 0.2);
    }

    // Input handlers
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ' || e.key === 'Enter') {
        if (state !== 'PLAYING') resetGame();
      }
    });
    window.addEventListener('keyup', e => keys[e.key] = false);

    canvas.addEventListener('click', () => {
      if (state !== 'PLAYING') resetGame();
    });

    window.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const scale = W / rect.width;
      const mx = (e.clientX - rect.left) * scale;
      if (state === 'PLAYING') {
        player.targetX = Math.max(160, Math.min(W - 160, mx));
      }
    });

    function spawnEntity() {
      const isToken = Math.random() < 0.4;
      const lane = Math.floor(Math.random() * 5); // 5 lanes
      const laneWidth = 560 / 5;
      const x = 200 + lane * laneWidth + laneWidth / 2;

      entities.push({
        type: isToken ? 'TOKEN' : 'TRAFFIC',
        x: x,
        y: 220, // horizon
        scale: 0.1,
        color: isToken ? '#00f2fe' : (Math.random() > 0.5 ? '#f43f5e' : '#9333ea'),
        speedFactor: isToken ? 1.0 : (0.5 + Math.random() * 0.4)
      });
    }

    let spawnTimer = 0;

    function update() {
      if (state !== 'PLAYING') return;

      // Controls
      if (keys['a'] || keys['A'] || keys['ArrowLeft']) player.targetX -= 12;
      if (keys['d'] || keys['D'] || keys['ArrowRight']) player.targetX += 12;
      player.targetX = Math.max(180, Math.min(W - 180, player.targetX));

      // Boost control
      if ((keys['w'] || keys['W'] || keys['ArrowUp'] || keys['Shift']) && boost > 1) {
        isBoosting = true;
        speed = Math.min(maxSpeed, speed + 3);
        boost = Math.max(0, boost - 0.5);
      } else {
        isBoosting = false;
        if (keys['s'] || keys['S'] || keys['ArrowDown']) {
          speed = Math.max(100, speed - 4);
        } else {
          speed += (baseSpeed - speed) * 0.05;
        }
        boost = Math.min(100, boost + 0.15);
      }

      player.x += (player.targetX - player.x) * 0.25;
      distance += Math.round(speed / 30);
      roadOffset += speed * 0.08;

      // Spawning
      spawnTimer += speed / 60;
      if (spawnTimer > 160) {
        spawnEntity();
        spawnTimer = 0;
      }

      // Update entities
      for (let i = entities.length - 1; i >= 0; i--) {
        const ent = entities[i];
        ent.scale += 0.003 * (speed / 100);
        ent.y += (speed * ent.speedFactor) * 0.035 * (1 + ent.scale * 3);

        // Perspective horizontal drift
        const centerX = W / 2;
        ent.drawX = centerX + (ent.x - centerX) * (1 + ent.scale * 2.2);

        // Collision Check near player Y
        if (ent.y > 400 && ent.y < 480) {
          const dist = Math.abs(ent.drawX - player.x);
          const hitThreshold = ent.type === 'TOKEN' ? 45 : 55;

          if (dist < hitThreshold) {
            if (ent.type === 'TOKEN') {
              boost = Math.min(100, boost + 25);
              distance += 250;
              entities.splice(i, 1);
              playBeep(880, 0.12, 'triangle', 0.2);
              continue;
            } else {
              // Crash
              state = 'CRASHED';
              playBeep(120, 0.5, 'sawtooth', 0.3);
              return;
            }
          }
        }

        if (ent.y > H + 50) {
          entities.splice(i, 1);
        }
      }

      // Particles for hovercraft thrusters
      const trailCount = isBoosting ? 4 : 2;
      for (let i = 0; i < trailCount; i++) {
        particles.push({
          x: player.x + (Math.random() - 0.5) * 35,
          y: player.y + 20,
          vx: (Math.random() - 0.5) * 2,
          vy: 4 + Math.random() * 4,
          life: 1,
          color: isBoosting ? '#00f2fe' : '#9333ea',
          size: 3 + Math.random() * 4
        });
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Update HUD
      hudSpeed.textContent = Math.round(speed) + ' KM/H';
      hudBoost.textContent = Math.round(boost) + '%';
      hudDist.textContent = distance + ' M';
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Sky gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, 220);
      skyGrad.addColorStop(0, '#090d16');
      skyGrad.addColorStop(1, '#2a0845');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, 220);

      // Synthwave Sun
      ctx.save();
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 25;
      const sunGrad = ctx.createLinearGradient(0, 80, 0, 220);
      sunGrad.addColorStop(0, '#fbbf24');
      sunGrad.addColorStop(1, '#f43f5e');
      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(W / 2, 220, 90, Math.PI, 0, false);
      ctx.fill();

      // Sun blind slices
      ctx.fillStyle = '#090d16';
      ctx.fillRect(W / 2 - 95, 175, 190, 5);
      ctx.fillRect(W / 2 - 95, 190, 190, 8);
      ctx.fillRect(W / 2 - 95, 207, 190, 10);
      ctx.restore();

      // Road Floor
      ctx.fillStyle = '#0c1020';
      ctx.fillRect(0, 220, W, H - 220);

      // Perspective Grid Lines
      ctx.strokeStyle = '#9333ea';
      ctx.lineWidth = 1.5;
      const lanes = [-2.5, -1.5, -0.5, 0.5, 1.5, 2.5];
      for (const lane of lanes) {
        ctx.beginPath();
        ctx.moveTo(W / 2 + lane * 40, 220);
        ctx.lineTo(W / 2 + lane * 340, H);
        ctx.stroke();
      }

      // Road Border Neons
      ctx.save();
      ctx.shadowColor = '#00f2fe';
      ctx.shadowBlur = 12;
      ctx.strokeStyle = '#00f2fe';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(W / 2 - 120, 220);
      ctx.lineTo(W / 2 - 420, H);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(W / 2 + 120, 220);
      ctx.lineTo(W / 2 + 420, H);
      ctx.stroke();
      ctx.restore();

      // Horizontal Moving Speed Stripes
      for (let y = 220; y < H; y += 25) {
        const adjustedY = ((y - 220 + roadOffset) % (H - 220)) + 220;
        const progress = (adjustedY - 220) / (H - 220);
        ctx.strokeStyle = `rgba(0, 242, 254, ${progress * 0.4})`;
        ctx.lineWidth = 1 + progress * 2;
        ctx.beginPath();
        ctx.moveTo(W / 2 - 120 - progress * 300, adjustedY);
        ctx.lineTo(W / 2 + 120 + progress * 300, adjustedY);
        ctx.stroke();
      }

      // Draw Entities
      for (const ent of entities) {
        const sz = 20 + ent.scale * 60;
        ctx.save();
        ctx.shadowColor = ent.color;
        ctx.shadowBlur = 15;
        ctx.fillStyle = ent.color;

        if (ent.type === 'TOKEN') {
          ctx.beginPath();
          ctx.arc(ent.drawX, ent.y, sz * 0.35, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(ent.drawX, ent.y, sz * 0.15, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Traffic Cyber Car
          ctx.beginPath();
          ctx.roundRect(ent.drawX - sz / 2, ent.y - sz * 0.3, sz, sz * 0.6, 6);
          ctx.fill();
          // Taillights
          ctx.fillStyle = '#f43f5e';
          ctx.fillRect(ent.drawX - sz * 0.4, ent.y + sz * 0.15, sz * 0.25, 4);
          ctx.fillRect(ent.drawX + sz * 0.15, ent.y + sz * 0.15, sz * 0.25, 4);
        }
        ctx.restore();
      }

      // Draw Particles
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 6;
        ctx.fillRect(p.x - p.size / 2, p.y, p.size, p.size * 2);
        ctx.restore();
      }

      // Draw Player Hovercar
      ctx.save();
      ctx.shadowColor = isBoosting ? '#00f2fe' : '#9333ea';
      ctx.shadowBlur = 20;

      // Chassis
      ctx.fillStyle = '#131b2e';
      ctx.strokeStyle = isBoosting ? '#00f2fe' : '#9333ea';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(player.x - 38, player.y - 15, 76, 32, 8);
      ctx.fill();
      ctx.stroke();

      // Cyber Spoiler
      ctx.fillStyle = '#090d16';
      ctx.fillRect(player.x - 44, player.y + 12, 88, 6);

      // Dual Thrusters
      ctx.fillStyle = '#00f2fe';
      ctx.fillRect(player.x - 28, player.y + 14, 14, 6);
      ctx.fillRect(player.x + 14, player.y + 14, 14, 6);

      // Cockpit Glow
      ctx.fillStyle = '#00f2fe';
      ctx.beginPath();
      ctx.ellipse(player.x, player.y - 4, 16, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Overlay Screens
      if (state === 'TITLE') {
        renderOverlay('CYBER DRIFT: NEO TOKYO', 'CLICK OR PRESS SPACE TO ENGAGE NITROUS', '#00f2fe');
      } else if (state === 'CRASHED') {
        renderOverlay('COLLISION DETECTED', `DISTANCE REACHED: ${distance} M - PRESS SPACE TO RESTART`, '#f43f5e');
      }
    }

    function renderOverlay(title, subtitle, color) {
      ctx.save();
      ctx.fillStyle = 'rgba(9, 13, 22, 0.85)';
      ctx.fillRect(0, 0, W, H);

      ctx.shadowColor = color;
      ctx.shadowBlur = 20;
      ctx.fillStyle = color;
      ctx.font = '900 40px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(title, W / 2, H / 2 - 20);

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#f8fafc';
      ctx.font = '600 16px monospace';
      ctx.fillText(subtitle, W / 2, H / 2 + 35);
      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
