<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Survivor: Void Breach - GlitchNest</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #090d16;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 56.25vw;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @media (min-aspect-ratio: 16/9) {
      #game-container {
        width: 177.78vh;
        height: 100vh;
      }
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #090d16;
    }
    #hud {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 16px;
      text-shadow: 0 0 10px #00f2fe;
    }
    .neon-cyan { color: #00f2fe; }
    .neon-violet { color: #9333ea; }
    .neon-red { color: #f43f5e; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="960" height="540"></canvas>
    <div id="hud">
      <div>SCORE: <span id="hudScore" class="neon-cyan">0</span></div>
      <div>WAVE: <span id="hudWave" class="neon-violet">1</span></div>
      <div>HULL: <span id="hudHp" class="neon-red">100%</span></div>
    </div>
  </div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playSfx(freq, type = 'sine', duration = 0.1, gainVal = 0.15) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const hudScore = document.getElementById('hudScore');
    const hudWave = document.getElementById('hudWave');
    const hudHp = document.getElementById('hudHp');

    const W = 960;
    const H = 540;

    let state = 'TITLE'; // TITLE, PLAYING, GAMEOVER
    let score = 0;
    let wave = 1;
    let waveTimer = 0;

    // Player
    const player = {
      x: W / 2,
      y: H / 2,
      hp: 100,
      speed: 4.5,
      angle: 0,
      fireRate: 8,
      fireCooldown: 0,
      weaponLevel: 1
    };

    let bullets = [];
    let enemies = [];
    let particles = [];
    let mouse = { x: W / 2, y: H / 2, down: false };

    function resetGame() {
      score = 0;
      wave = 1;
      waveTimer = 0;
      player.x = W / 2;
      player.y = H / 2;
      player.hp = 100;
      player.weaponLevel = 1;
      bullets = [];
      enemies = [];
      particles = [];
      state = 'PLAYING';
      playSfx(523, 'triangle', 0.2);
    }

    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ' || e.key === 'Enter') {
        if (state !== 'PLAYING') resetGame();
      }
    });
    window.addEventListener('keyup', e => keys[e.key] = false);

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const scaleY = H / rect.height;
      mouse.x = (e.clientX - rect.left) * scaleX;
      mouse.y = (e.clientY - rect.top) * scaleY;
    });

    canvas.addEventListener('mousedown', () => mouse.down = true);
    window.addEventListener('mouseup', () => mouse.down = false);
    canvas.addEventListener('click', () => {
      if (state !== 'PLAYING') resetGame();
    });

    function spawnEnemy() {
      // Spawn at canvas perimeter
      let x, y;
      if (Math.random() < 0.5) {
        x = Math.random() < 0.5 ? -20 : W + 20;
        y = Math.random() * H;
      } else {
        x = Math.random() * W;
        y = Math.random() < 0.5 ? -20 : H + 20;
      }

      const types = [
        { hp: 1, speed: 2.2, color: '#f43f5e', pts: 100, size: 14 },
        { hp: 2, speed: 1.6, color: '#9333ea', pts: 200, size: 18 },
        { hp: 4, speed: 1.0, color: '#fbbf24', pts: 400, size: 24 }
      ];
      const type = types[Math.floor(Math.random() * Math.min(types.length, 1 + Math.floor(wave / 2)))];

      enemies.push({
        x,
        y,
        hp: type.hp,
        speed: type.speed + wave * 0.1,
        color: type.color,
        pts: type.pts,
        size: type.size
      });
    }

    function spawnExplosion(x, y, color, count = 16) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 1.5 + Math.random() * 4.5;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 1,
          decay: 0.03 + Math.random() * 0.03,
          color,
          size: 2 + Math.random() * 3
        });
      }
    }

    function update() {
      if (state !== 'PLAYING') return;

      // Player Movement
      let dx = 0;
      let dy = 0;
      if (keys['w'] || keys['W'] || keys['ArrowUp']) dy -= 1;
      if (keys['s'] || keys['S'] || keys['ArrowDown']) dy += 1;
      if (keys['a'] || keys['A'] || keys['ArrowLeft']) dx -= 1;
      if (keys['d'] || keys['D'] || keys['ArrowRight']) dx += 1;

      if (dx !== 0 && dy !== 0) {
        dx *= 0.7071;
        dy *= 0.7071;
      }

      player.x += dx * player.speed;
      player.y += dy * player.speed;
      player.x = Math.max(25, Math.min(W - 25, player.x));
      player.y = Math.max(25, Math.min(H - 25, player.y));

      player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

      // Player Firing
      if (player.fireCooldown > 0) player.fireCooldown--;
      if ((mouse.down || keys[' ']) && player.fireCooldown <= 0) {
        player.fireCooldown = player.fireRate;
        const count = player.weaponLevel === 1 ? 1 : player.weaponLevel === 2 ? 2 : 3;
        
        if (count === 1) {
          bullets.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(player.angle) * 11,
            vy: Math.sin(player.angle) * 11
          });
        } else if (count === 2) {
          const spread = 0.12;
          bullets.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(player.angle - spread) * 11,
            vy: Math.sin(player.angle - spread) * 11
          });
          bullets.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(player.angle + spread) * 11,
            vy: Math.sin(player.angle + spread) * 11
          });
        } else {
          const spread = 0.2;
          bullets.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(player.angle) * 12,
            vy: Math.sin(player.angle) * 12
          });
          bullets.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(player.angle - spread) * 11,
            vy: Math.sin(player.angle - spread) * 11
          });
          bullets.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(player.angle + spread) * 11,
            vy: Math.sin(player.angle + spread) * 11
          });
        }
        playSfx(784, 'square', 0.05, 0.1);
      }

      // Update Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) {
          bullets.splice(i, 1);
        }
      }

      // Spawning enemies & wave progression
      waveTimer++;
      if (waveTimer % Math.max(25, 80 - wave * 8) === 0) {
        spawnEnemy();
      }
      if (waveTimer > 900) {
        wave++;
        waveTimer = 0;
        if (wave % 2 === 0 && player.weaponLevel < 3) {
          player.weaponLevel++;
          playSfx(1046, 'sine', 0.3, 0.25);
        }
      }

      // Update Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;

        // Check collision with player
        const distP = Math.hypot(e.x - player.x, e.y - player.y);
        if (distP < e.size + 15) {
          player.hp -= 15;
          spawnExplosion(e.x, e.y, e.color, 12);
          enemies.splice(i, 1);
          playSfx(150, 'sawtooth', 0.2, 0.3);
          if (player.hp <= 0) {
            state = 'GAMEOVER';
            playSfx(98, 'sawtooth', 0.5, 0.4);
            return;
          }
          continue;
        }

        // Check collision with bullets
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const distB = Math.hypot(e.x - b.x, e.y - b.y);
          if (distB < e.size + 6) {
            bullets.splice(j, 1);
            e.hp--;
            if (e.hp <= 0) {
              score += e.pts;
              spawnExplosion(e.x, e.y, e.color, 18);
              enemies.splice(i, 1);
              playSfx(330, 'triangle', 0.08, 0.15);
            } else {
              spawnExplosion(b.x, b.y, '#00f2fe', 4);
            }
            break;
          }
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Update HUD
      hudScore.textContent = score;
      hudWave.textContent = wave;
      hudHp.textContent = Math.max(0, player.hp) + '%';
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Arena Grid
      ctx.strokeStyle = '#12182c';
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = 0; y < H; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      // Center void fracture ring
      ctx.save();
      ctx.strokeStyle = 'rgba(147, 51, 234, 0.2)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(W / 2, H / 2, 140, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Bullets
      ctx.save();
      ctx.shadowColor = '#00f2fe';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#00f2fe';
      for (const b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Enemies
      for (const e of enemies) {
        ctx.save();
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#131b2e';
        ctx.strokeStyle = e.color;
        ctx.lineWidth = 2.5;

        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Particles
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 6;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        ctx.restore();
      }

      // Player Ship
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);
      ctx.shadowColor = '#00f2fe';
      ctx.shadowBlur = 18;

      ctx.fillStyle = '#131b2e';
      ctx.strokeStyle = '#00f2fe';
      ctx.lineWidth = 2.5;

      ctx.beginPath();
      ctx.moveTo(18, 0);
      ctx.lineTo(-14, -14);
      ctx.lineTo(-6, 0);
      ctx.lineTo(-14, 14);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Cockpit glow
      ctx.fillStyle = '#00f2fe';
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Overlay
      if (state === 'TITLE') {
        renderOverlay('NEON SURVIVOR: VOID BREACH', 'WASD TO THRUST, MOUSE AIM & CLICK TO FIRE - CLICK TO START', '#00f2fe');
      } else if (state === 'GAMEOVER') {
        renderOverlay('VESSEL DESTROYED', `FINAL SCORE: ${score} (WAVE ${wave}) - PRESS SPACE TO RETRY`, '#f43f5e');
      }
    }

    function renderOverlay(title, subtitle, color) {
      ctx.save();
      ctx.fillStyle = 'rgba(9, 13, 22, 0.85)';
      ctx.fillRect(0, 0, W, H);

      ctx.shadowColor = color;
      ctx.shadowBlur = 20;
      ctx.fillStyle = color;
      ctx.font = '900 38px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(title, W / 2, H / 2 - 20);

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#f8fafc';
      ctx.font = '600 15px monospace';
      ctx.fillText(subtitle, W / 2, H / 2 + 35);
      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
